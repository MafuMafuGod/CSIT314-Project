<!-- Home screen after login: quick search and category links -->

{% extends "base.html" %}
{% block title %}Home | 4RENO{% endblock %}
{% block content %}

<section class="hero">
    <h2>Find the right interior designer for your home</h2>
    <p>Browse projects from designers and save the ones you like!</p>

    <form method="get" action="{{ url_for('search_idp.searchPage') }}" class="search-row">
        <div><input type="text" name="keyword" placeholder="Search by keyword" maxlength="100"></div>
        <div><select name="category">
                <option value="">All categories</option>
                {% for c in categories %}<option>{{ c }}</option>{% endfor %}
            </select></div>
        <button class="btn" type="submit">Search</button>
    </form>
</section>

<h3>Browse by category</h3>
<div class="chips">
    {% for c in categories %}<a class="chip" href="{{ url_for('search_idp.searchPage', category=c) }}">{{ c }}</a>{%
    endfor %}
</div>
{% endblock %}
